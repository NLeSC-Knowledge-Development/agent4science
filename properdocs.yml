site_name: Agent for Science
site_url: https://nlesc-knowledge-development.github.io/agent4science/
repo_url: https://github.com/NLeSC-Knowledge-Development/agent4science

theme:
  name: 'material'
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: white
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: "Switch to dark mode"
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: white
    accent: purple
    toggle:
      icon: material/weather-night
      name: "Switch to light mode"
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.top
    - search.highlight
    - search.suggest
  icon:
    logo: 'material/library-outline'
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
  # favicon: images/XXX.svg
  # logo: images/XXX.svg

markdown_extensions:
  - admonition
  - md_in_html

nav:
  # - Home: index.md
  - Agent 101:
    - What is AI agent?: agent101/what-is-AI-agent.md
    - What is LLM? : agent101/what-is-llm.md
    - Open LLM models: agent101/open-llm-models.md
    - LLM inference engines: agent101/llm-inference-engines.md
    - What is harness?: agent101/what-is-harness.md
    - Agent skills: agent101/agent-skills.md
    - MCP: agent101/mcp.md
    - RAG: agent101/rag.md
    - Sandbox: agent101/sandbox.md
  - Tutorials:
    - Run Ollama on SURF Research Cloud: tutorials/ollama-surf.md
  - Demos:
    - PROBE: demos/probe.md